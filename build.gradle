plugins {
    id 'java'
    id 'application'
    id 'org.sonarqube' version '5.0.0.4638'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.example.App'
}